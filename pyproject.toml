[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insiderlab"
version = "0.1.0"
description = "Insider-signal research lab: SEC Form 4 purchases, pre-registered hypotheses, honest validation against the S&P 500."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "overfitlab",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
prices = ["yfinance>=0.2.40"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
insiderlab = "insiderlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
"src/insiderlab/report.py" = ["E501"]  # markdown templates
