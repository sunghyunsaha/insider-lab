name: Research run

# Started by hand (Actions tab -> Research run -> Run workflow).
# NOTE (2026-11-25): the SEC refuses GitHub's servers (HTTP 403), so stage=full fails at the
# SEC step today; use scripts/run_local.ps1 on a home PC. stage=check shows reachability. Optional repository secrets:
#   SEC_USER_AGENT  "insider-lab your@email" (the SEC asks for a contact)
#   TIINGO_API_KEY  enables Tiingo prices, which cover more delisted companies

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "check = reachability only; full = data + backtest + commit"
        required: true
        default: full
        type: choice
        options: [check, full]
      price_limit:
        description: "fetch prices for at most this many tickers (0 = all)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'insider-lab research github.com/sunghyunsaha/insider-lab 198362482+sunghyunsaha@users.noreply.github.com' }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Reachability
        run: insiderlab data-check
      - name: Price source check
        if: inputs.stage == 'check'
        run: insiderlab price-check
      - name: Restore data cache
        if: inputs.stage == 'full'
        uses: actions/cache/restore@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: SEC data sets
        if: inputs.stage == 'full'
        run: insiderlab fetch-sec
      - name: Prices and USD/KRW
        if: inputs.stage == 'full'
        run: insiderlab fetch-prices --limit ${{ inputs.price_limit }}
      - name: Save data cache
        if: always() && inputs.stage == 'full'
        uses: actions/cache/save@v4
        with:
          path: data
          key: data-${{ github.run_id }}
      - name: Backtest
        if: inputs.stage == 'full'
        run: insiderlab backtest
      - name: Upload results
        if: always() && inputs.stage == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: research-results
          path: |
            reports/
            data/prices/_missing.json
          if-no-files-found: warn
      - name: Commit generated reports
        if: inputs.stage == 'full'
        run: |
          git config user.name "insider-lab research bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/REPORT.md reports/results reports/figures README.md
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "Research run: regenerate reports from real data"
          git push
